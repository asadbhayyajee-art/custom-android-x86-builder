name: Build Custom Lineage-x86 ISO (libndk + VirGL + VBox)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Build Dependencies & Setup Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib gnupg gperf imagemagick lib32z1-dev liblz4-tool libncurses-dev \
            libsdl2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc yasm zlib1g-dev wget python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure Git Identity & Sync Lineage-x86 Source
        run: |
          git config --global user.email "builder@runner.local"
          git config --global user.name "GitHub Runner"
          mkdir -p ~/lineage-x86
          cd ~/lineage-x86
          repo init -u https://github.com/android-x86/manifest.git -b lineage-17.1-r2
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

      - name: Inject libndk (ARM Translation Bridge)
        run: |
          cd ~/lineage-x86
          mkdir -p vendor/redroid/nativebridge
          wget https://github.com/remote-android/redroid-doc/releases/download/v0.0.1/libndk_translation.tar.gz -O /tmp/libndk.tar.gz
          tar -xvf /tmp/libndk.tar.gz -C vendor/redroid/nativebridge/
          
          PRODUCT_OUT_DIR="device/generic/common"
          echo "PRODUCT_PROPERTY_OVERRIDES += \\" >> $PRODUCT_OUT_DIR/device.mk
          echo "    ro.enable.native.bridge=1 \\" >> $PRODUCT_OUT_DIR/device.mk
          echo "    ro.dalvik.vm.isa.arm=x86 \\" >> $PRODUCT_OUT_DIR/device.mk
          echo "    ro.dalvik.vm.isa.arm64=x86_64" >> $PRODUCT_OUT_DIR/device.mk

      - name: Inject VirtualBox Drivers & USB 2.0/3.0 Configs
        run: |
          cd ~/lineage-x86
          KERNEL_CONFIG="kernel/arch/x86/configs/x86_64_defconfig"
          if [ -f "$KERNEL_CONFIG" ]; then
            echo "CONFIG_VBOXGUEST=y" >> $KERNEL_CONFIG
            echo "CONFIG_VBOXSF=y" >> $KERNEL_CONFIG
            echo "CONFIG_USB_EHCI_HCD=y" >> $KERNEL_CONFIG
            echo "CONFIG_USB_XHCI_HCD=y" >> $KERNEL_CONFIG
          fi

      - name: Configure Mesa VirGL & Graphics Pipeline
        run: |
          cd ~/lineage-x86
          BOARD_CONFIG="device/generic/common/BoardConfig.mk"
          echo "USE_OPENGL_RENDERER := true" >> $BOARD_CONFIG
          echo "BOARD_GPU_DRIVERS := virgl mesa3d" >> $BOARD_CONFIG
          echo "NUM_FRAME_BUFFERS := 3" >> $BOARD_CONFIG

      - name: Build Lineage-x86 ISO Image
        run: |
          cd ~/lineage-x86
          source build/envsetup.sh
          lunch lineage_x86_64-userdebug
          m -j$(nproc) iso_img

      - name: Upload Custom Lineage ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-lineage-x86-libndk-iso
          path: ~/lineage-x86/out/target/product/x86_64/*.iso